<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parachute Drop - TwitchGames</title>
<link rel="stylesheet" href="parachute.css">
</head>
<body>
<div class="game-container">
  <canvas id="gameCanvas"></canvas>
  <div class="game-ui">
    <div class="score-display" id="scoreDisplay">Очки: 0</div>
    <div class="controls-hint" id="controlsHint">Команда чата: !drop</div>
  </div>
  <div class="chat-log" id="chatLog"></div>
</div>
<script>
(function() {
  const params = new URLSearchParams(window.location.search);
  const CMD = params.get('command') || '!drop';
  const GRAVITY = parseFloat(params.get('gravity')) || 0.05;
  const MAX_SPEED = parseFloat(params.get('maxSpeed')) || 2.5;
  const WIND = parseFloat(params.get('windStrength')) || 0.4;
  const TARGET_W_PCT = parseFloat(params.get('targetWidthPercent')) || 12;
  const TARGET_H_PCT = parseFloat(params.get('targetHeightPercent')) || 8;
  const BASE_SCORE = parseInt(params.get('baseScore')) || 100;
  const MAX_BONUS = parseInt(params.get('maxBonus')) || 400;
  const OPTIMAL_MS = parseInt(params.get('optimalTimeMs')) || 8000;
  const MAX_TIME_MS = parseInt(params.get('maxTimeMs')) || 25000;
  const TARGET_DISPLAY_MS = parseInt(params.get('targetDisplayDurationMs')) || 10000;
  const THEME = params.get('theme') || 'cauldron';

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreDisplay = document.getElementById('scoreDisplay');
  const chatLog = document.getElementById('chatLog');

  let W, H;
  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  // === THEME REGISTRY ===
  // Add new themes here — one entry per theme. No game logic changes needed.
  const THEMES = {
    cauldron: {
      name: 'Котёл',
      emoji: '🫕',
      targetLabel: 'Котёл',
      targetColor: '#1a472a',
      targetBorder: '#22c55e',
      bg: ['#0f0f23', '#1a1a2e'],
      splashColors: ['#22c55e', '#4ade80', '#86efac', '#bbf7d0'],
      particleType: 'bubbles',
      icon: '🪄',
      renderTarget(ctx, x, y, w, h, time) {
        ctx.save();
        const cx = x + w / 2, cy = y + h / 2;
        const r = Math.min(w, h) * 0.35;
        ctx.beginPath();
        ctx.ellipse(cx, cy + r * 0.2, r, r * 0.7, 0, 0, Math.PI * 2);
        ctx.fillStyle = '#2d1a0e';
        ctx.fill();
        ctx.strokeStyle = '#5c3a1e';
        ctx.lineWidth = 3;
        ctx.stroke();
        const glow = Math.sin(time / 300) * 0.15 + 0.35;
        ctx.beginPath();
        ctx.ellipse(cx, cy + r * 0.15, r * 0.8, r * 0.5, 0, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(34,197,94,${glow})`;
        ctx.fill();
        for (let i = 0; i < 3; i++) {
          const bx = cx + Math.sin(time / 500 + i * 2) * r * 0.4;
          const by = cy + r * 0.2 - ((time / 800 + i * 0.33) % 1) * r * 0.8;
          ctx.beginPath();
          ctx.arc(bx, by, 3 + Math.sin(time / 200 + i) * 2, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(74,222,128,${0.4 + Math.sin(time / 200 + i) * 0.2})`;
          ctx.fill();
        }
        ctx.fillStyle = '#5c3a1e';
        ctx.fillRect(cx - r * 1.3, cy - r * 0.1, r * 0.2, r * 0.4);
        ctx.fillRect(cx + r * 1.1, cy - r * 0.1, r * 0.2, r * 0.4);
        ctx.restore();
      },
      spawnParticles(px, py, colors, addFn) {
        for (let i = 0; i < 24; i++) {
          const a = Math.random() * Math.PI * 2;
          const s = 1 + Math.random() * 3;
          addFn({ x: px, y: py, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2,
            r: 3 + Math.random() * 6, color: colors[Math.floor(Math.random() * colors.length)],
            life: 1, decay: 0.015, type: 'circle' });
        }
      },
    },
    snow: {
      name: 'Сугроб',
      emoji: '⛄',
      targetLabel: 'Сугроб',
      targetColor: '#e0f2fe',
      targetBorder: '#38bdf8',
      bg: ['#0c1929', '#162032'],
      splashColors: ['#e0f2fe', '#bae6fd', '#7dd3fc', '#f0f9ff'],
      particleType: 'snow',
      icon: '⛄',
      renderTarget(ctx, x, y, w, h, time) {
        ctx.save();
        const cx = x + w / 2, cy = y + h * 0.7;
        ctx.beginPath();
        ctx.ellipse(cx, cy, w * 0.5, h * 0.4, 0, Math.PI, 0);
        ctx.fillStyle = '#e0f2fe';
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(cx - w * 0.15, cy - h * 0.1, w * 0.2, h * 0.25, -0.2, Math.PI, 0);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(cx + w * 0.18, cy - h * 0.08, w * 0.18, h * 0.22, 0.3, Math.PI, 0);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(cx, cy - h * 0.15, w * 0.12, h * 0.15, 0, 0, Math.PI * 2);
        ctx.fillStyle = '#38bdf8';
        ctx.fill();
        ctx.restore();
      },
      spawnParticles(px, py, colors, addFn) {
        for (let i = 0; i < 30; i++) {
          const a = Math.random() * Math.PI * 2;
          const s = 0.5 + Math.random() * 2;
          addFn({ x: px, y: py, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 3,
            r: 1.5 + Math.random() * 3, color: colors[Math.floor(Math.random() * colors.length)],
            life: 1, decay: 0.012, type: 'circle' });
        }
      },
    },
    pool: {
      name: 'Бассейн',
      emoji: '🏊',
      targetLabel: 'Бассейн',
      targetColor: '#0ea5e9',
      targetBorder: '#38bdf8',
      bg: ['#0a1628', '#0f2847'],
      splashColors: ['#38bdf8', '#7dd3fc', '#bae6fd', '#e0f2fe'],
      particleType: 'bubbles',
      icon: '🏊',
      renderTarget(ctx, x, y, w, h, time) {
        ctx.save();
        ctx.beginPath();
        ctx.ellipse(x + w / 2, y + h * 0.6, w * 0.45, h * 0.35, 0, 0, Math.PI * 2);
        const grad = ctx.createRadialGradient(x + w / 2, y + h * 0.5, 0, x + w / 2, y + h * 0.5, w * 0.5);
        grad.addColorStop(0, '#0ea5e9');
        grad.addColorStop(1, '#0369a1');
        ctx.fillStyle = grad;
        ctx.fill();
        for (let i = 0; i < 4; i++) {
          const rx = x + w * (0.15 + i * 0.25);
          ctx.beginPath();
          ctx.moveTo(rx, y + h * 0.35);
          for (let t = 0; t <= 20; t++) {
            const ry = y + h * 0.35 + Math.sin(t * 0.5 + time / 300 + i) * 4;
            ctx.lineTo(rx + t * 1.5, ry);
          }
          ctx.strokeStyle = 'rgba(56,189,248,0.5)';
          ctx.lineWidth = 2;
          ctx.stroke();
        }
        ctx.restore();
      },
      spawnParticles(px, py, colors, addFn) {
        for (let i = 0; i < 20; i++) {
          const a = Math.random() * Math.PI * 2;
          const s = 1 + Math.random() * 3;
          addFn({ x: px, y: py, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 3,
            r: 2 + Math.random() * 5, color: colors[Math.floor(Math.random() * colors.length)],
            life: 1, decay: 0.018, type: 'circle' });
        }
      },
    },
    leaves: {
      name: 'Куча листьев',
      emoji: '🍂',
      targetLabel: 'Куча листьев',
      targetColor: '#92400e',
      targetBorder: '#f59e0b',
      bg: ['#1a1208', '#2d1f0f'],
      splashColors: ['#f59e0b', '#d97706', '#b45309', '#78350f'],
      particleType: 'leaves',
      icon: '🍂',
      renderTarget(ctx, x, y, w, h, time) {
        ctx.save();
        for (let i = 0; i < 12; i++) {
          const lx = x + w * (0.1 + Math.random() * 0.8);
          const ly = y + h * (0.3 + Math.random() * 0.6);
          const size = 6 + Math.random() * 10;
          ctx.save();
          ctx.translate(lx, ly);
          ctx.rotate(Math.random() * Math.PI * 2);
          ctx.beginPath();
          ctx.ellipse(0, 0, size, size * 0.5, 0, 0, Math.PI * 2);
          ctx.fillStyle = ['#f59e0b', '#d97706', '#b45309', '#92400e'][Math.floor(Math.random() * 4)];
          ctx.globalAlpha = 0.7;
          ctx.fill();
          ctx.restore();
        }
        ctx.restore();
      },
      spawnParticles(px, py, colors, addFn) {
        for (let i = 0; i < 20; i++) {
          const a = Math.random() * Math.PI * 2;
          const s = 0.5 + Math.random() * 2;
          addFn({ x: px, y: py, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2,
            r: 4 + Math.random() * 6, color: colors[Math.floor(Math.random() * colors.length)],
            life: 1, decay: 0.008, type: 'leaf' });
        }
      },
    },
    rainbow: {
      name: 'Радуга',
      emoji: '🌈',
      targetLabel: 'Радуга',
      targetColor: '#7c3aed',
      targetBorder: '#a78bfa',
      bg: ['#1a1a2e', '#2d1b69'],
      splashColors: ['#ef4444', '#f59e0b', '#22c55e', '#3b82f6', '#8b5cf6'],
      particleType: 'confetti',
      icon: '🌈',
      renderTarget(ctx, x, y, w, h, time) {
        ctx.save();
        ctx.beginPath();
        ctx.ellipse(x + w / 2, y + h + h * 0.3, w * 0.4, h * 0.6, 0, Math.PI, 0);
        const rainbowColors = ['#ef4444', '#f59e0b', '#22c55e', '#3b82f6', '#8b5cf6'];
        for (let i = 0; i < rainbowColors.length; i++) {
          ctx.beginPath();
          ctx.ellipse(x + w / 2, y + h + h * 0.3, w * (0.4 - i * 0.06), h * (0.6 - i * 0.08), 0, Math.PI, 0);
          ctx.strokeStyle = rainbowColors[i];
          ctx.lineWidth = 8;
          ctx.stroke();
        }
        ctx.restore();
      },
      spawnParticles(px, py, colors, addFn) {
        for (let i = 0; i < 30; i++) {
          const a = Math.random() * Math.PI * 2;
          const s = 1 + Math.random() * 4;
          addFn({ x: px, y: py, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 3,
            r: 2 + Math.random() * 4, color: colors[Math.floor(Math.random() * colors.length)],
            life: 1, decay: 0.01, type: 'square' });
        }
      },
    },
    cake: {
      name: 'Торт',
      emoji: '🎂',
      targetLabel: 'Торт',
      targetColor: '#be185d',
      targetBorder: '#f472b6',
      bg: ['#1a0a1e', '#2d1038'],
      splashColors: ['#f472b6', '#ec4899', '#db2777', '#fbbf24'],
      particleType: 'confetti',
      icon: '🎂',
      renderTarget(ctx, x, y, w, h, time) {
        ctx.save();
        const cx = x + w / 2;
        ctx.beginPath();
        ctx.moveTo(cx - w * 0.35, y + h * 0.9);
        ctx.lineTo(cx - w * 0.3, y + h * 0.3);
        ctx.lineTo(cx + w * 0.3, y + h * 0.3);
        ctx.lineTo(cx + w * 0.35, y + h * 0.9);
        ctx.closePath();
        ctx.fillStyle = '#fce7f3';
        ctx.fill();
        ctx.strokeStyle = '#f472b6';
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.beginPath();
        ctx.ellipse(cx, y + h * 0.28, w * 0.32, h * 0.08, 0, 0, Math.PI * 2);
        ctx.fillStyle = '#fbbf24';
        ctx.fill();
        const cw = Math.sin(time / 400) * 4;
        ctx.beginPath();
        ctx.arc(cx, y + h * 0.08, 6 + cw, 0, Math.PI * 2);
        ctx.fillStyle = '#ef4444';
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(cx, y * 0.02);
        ctx.lineTo(cx - 4, y * 0.02);
        ctx.lineTo(cx, y * 0.02 + 6);
        ctx.closePath();
        ctx.fillStyle = '#fbbf24';
        ctx.fill();
        ctx.restore();
      },
      spawnParticles(px, py, colors, addFn) {
        for (let i = 0; i < 25; i++) {
          const a = Math.random() * Math.PI * 2;
          const s = 1 + Math.random() * 3;
          addFn({ x: px, y: py, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 3,
            r: 2 + Math.random() * 4, color: colors[Math.floor(Math.random() * colors.length)],
            life: 1, decay: 0.01, type: 'square' });
        }
      },
    },
  };

  function getTheme(id) {
    return THEMES[id] || THEMES.cauldron;
  }

  const theme = getTheme(THEME);

  // === CANVAS BACKGROUND ===
  const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, theme.bg[0]);
  bgGrad.addColorStop(1, theme.bg[1]);

  // === GAME STATE ===
  let totalScore = 0;
  let players = [];
  let particles = [];
  let floatingTexts = [];
  let landingZone = null;
  let zoneSpawnTime = 0;
  let stars = [];
  let chatMessages = [];
  let nextChatTime = 0;

  // Ambient stars
  for (let i = 0; i < 60; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H * 0.6,
      r: Math.random() * 1.5 + 0.5,
      phase: Math.random() * Math.PI * 2,
      speed: 0.003 + Math.random() * 0.005,
    });
  }

  // === LANDING ZONE ===
  function spawnLandingZone() {
    if (landingZone && Date.now() - zoneSpawnTime < TARGET_DISPLAY_MS) return;
    const tw = (TARGET_W_PCT / 100) * W;
    const th = (TARGET_H_PCT / 100) * H;
    const tx = 40 + Math.random() * Math.max(1, W - tw - 80);
    const ty = H - th - 20;
    landingZone = { x: tx, y: ty, w: tw, h: th };
    zoneSpawnTime = Date.now();
  }

  // === CHAT SIMULATION ===
  const FAKE_NAMES = ['GamerX', 'StreamFan', 'Viewer42', 'Ninja', 'Pixel', 'ChatWarrior', 'DropMaster', 'SkyDiver', 'Cloud9', 'ParachuteKing', 'Thunder', 'Blaze', 'Frost', 'Shadow', 'Vortex'];
  const FAKE_COLORS = ['#ff6b6b', '#feca57', '#48dbfb', '#ff9ff3', '#54a0ff', '#5f27cd', '#01a3a4', '#f368e0', '#ee5a24', '#2ed573'];

  function getTwitchAvatarUrl(username) {
    return `https://static-cdn.jtvnw.net/jtv_user_pictures/${encodeURIComponent(username)}-profile_image-300x300.png`;
  }

  function getNickColor(username) {
    let hash = 0;
    for (let i = 0; i < username.length; i++) {
      hash = username.charCodeAt(i) + ((hash << 5) - hash);
    }
    return FAKE_COLORS[Math.abs(hash) % FAKE_COLORS.length];
  }

  function simulateChat() {
    if (Date.now() < nextChatTime) return;
    nextChatTime = Date.now() + 1500 + Math.random() * 2000;
    const name = FAKE_NAMES[Math.floor(Math.random() * FAKE_NAMES.length)] + Math.floor(Math.random() * 999);
    const color = FAKE_COLORS[Math.floor(Math.random() * FAKE_COLORS.length)];
    chatMessages.push({ text: name + ': ' + CMD, color, time: Date.now() });
    if (chatMessages.length > 5) chatMessages.shift();
    spawnPlayer(name, color);
  }

  // === PLAYER ===
  function spawnPlayer(username, nickColor) {
    const avatarUrl = getTwitchAvatarUrl(username);
    const color = nickColor || getNickColor(username);

    const startX = 50 + Math.random() * Math.max(1, W - 100);
    const angle = (Math.random() - 0.5) * 0.8;
    const speed = 0.2 + Math.random() * 0.6;

    players.push({
      id: Date.now() + Math.random(),
      username,
      color,
      avatarUrl,
      avatarLoaded: false,
      avatarImg: new Image(),
      x: startX,
      y: -50,
      vx: Math.cos(angle) * speed,
      vy: 0.15 + Math.random() * 0.3,
      angularVx: 0,
      swingPhase: Math.random() * Math.PI * 2,
      swingAmp: 0.5 + Math.random() * 0.5,
      startTime: Date.now(),
      landed: false,
      landedAt: null,
      score: null,
      hitTarget: false,
      bounceCount: 0,
      fadeAlpha: 1,
    });

    const p = players[players.length - 1];
    p.avatarImg.onload = function() { p.avatarLoaded = true; };
    p.avatarImg.onerror = function() { p.avatarLoaded = false; };
    p.avatarImg.src = avatarUrl;
  }

  // === SCORE CALCULATION ===
  function calculateScore(flightTimeMs) {
    const ratio = Math.max(0, 1 - flightTimeMs / MAX_TIME_MS);
    const bonus = Math.round(MAX_BONUS * Math.pow(ratio, 1.5));
    const clampedBonus = Math.min(bonus, MAX_BONUS);
    return BASE_SCORE + clampedBonus;
  }

  // === PARTICLE SYSTEM ===
  function addParticle(p) {
    particles.push(p);
  }

  // === FLOATING TEXT ===
  function addFloatingText(x, y, text, color) {
    floatingTexts.push({ x, y, text, color, startTime: Date.now(), duration: 1500 });
  }

  // === PARACHUTE DRAWING ===
  function drawParachute(ctx, x, y, vx, vy, swingPhase, color, time, alpha) {
    const baseW = 48;
    const sway = Math.sin(swingPhase * 0.7) * 10;
    const lean = vx * 3;
    const billow = Math.sin(time / 700) * 2.5;
    const topY = y - 42;
    const bottomY = y - 12;

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(sway * 0.3 + lean, 0);

    // Canopy dome with scalloped bottom
    ctx.beginPath();
    ctx.moveTo(-baseW + sway * 0.5, bottomY);
    ctx.bezierCurveTo(
      -baseW - 4 + sway * 0.5, topY - 12 + billow,
      -baseW * 0.35 + sway * 0.5, topY - 20 + billow,
      0 + sway * 0.5, topY - 22 + billow
    );
    ctx.bezierCurveTo(
      baseW * 0.35 + sway * 0.5, topY - 20 + billow,
      baseW + 4 + sway * 0.5, topY - 12 + billow,
      baseW + sway * 0.5, bottomY
    );
    // Scalloped bottom
    const scallops = 7;
    for (let i = scallops - 1; i >= 0; i--) {
      const t = i / scallops;
      const sx = baseW - t * baseW * 2 + sway * 0.5;
      const prevX = baseW - ((i + 1) / scallops) * baseW * 2 + sway * 0.5;
      const prevY = bottomY;
      const scy = bottomY + 5 + Math.sin(swingPhase * 1.5 + i * 1.1) * 3;
      ctx.quadraticCurveTo(sx, scy, prevX, prevY);
    }
    ctx.closePath();

    // Gradient fill
    const grad = ctx.createLinearGradient(0, topY - 22, 0, bottomY + 5);
    grad.addColorStop(0, color + 'E0');
    grad.addColorStop(0.6, color + 'BB');
    grad.addColorStop(1, color + '88');
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Rib lines
    ctx.strokeStyle = 'rgba(255,255,255,0.22)';
    ctx.lineWidth = 0.8;
    for (let i = 1; i < 6; i++) {
      const rx = -baseW * 0.8 + (i / 6) * baseW * 1.6 + sway * 0.5;
      ctx.beginPath();
      ctx.moveTo(rx, bottomY + 3);
      ctx.quadraticCurveTo(rx * 0.4 + sway * 0.3, topY - 8 + billow, sway * 0.15, topY - 16 + billow);
      ctx.stroke();
    }

    // Center line
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.beginPath();
    ctx.moveTo(sway * 0.3, topY - 18 + billow);
    ctx.lineTo(0, bottomY);
    ctx.stroke();

    // Suspension lines
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 0.9;
    const lineAnchors = [-0.85, -0.55, -0.25, 0.25, 0.55, 0.85];
    for (const t of lineAnchors) {
      const ax = t * baseW * 2 + sway * 0.5;
      const ay = bottomY;
      const tx = t * 4 + sway * 0.1;
      const ty = y - 18;
      ctx.beginPath();
      ctx.moveTo(ax, ay);
      const mx = (ax + tx) * 0.5;
      const my = (ay + ty) * 0.5 + Math.sin(swingPhase + t) * 2;
      ctx.quadraticCurveTo(mx, my, tx, ty);
      ctx.stroke();
    }

    ctx.restore();
  }

  // === MAIN GAME LOOP ===
  function gameLoop(timestamp) {
    const time = Date.now();
    simulateChat();
    spawnLandingZone();

    ctx.clearRect(0, 0, W, H);

    // Background
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);

    // Stars
    for (const s of stars) {
      const alpha = 0.3 + Math.sin(s.phase + time * s.speed) * 0.3;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${alpha})`;
      ctx.fill();
    }

    // Chat log (small, top-right)
    ctx.font = '12px Inter, sans-serif';
    for (let i = 0; i < chatMessages.length; i++) {
      const msg = chatMessages[i];
      const age = time - msg.time;
      if (age > 6000) continue;
      const alpha = Math.max(0, 1 - age / 6000);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = msg.color;
      ctx.fillText(msg.text, 16, 50 + i * 18);
    }
    ctx.globalAlpha = 1;

    // Landing zone
    if (landingZone) {
      const zoneAge = time - zoneSpawnTime;
      const zoneAlpha = zoneAge < 500 ? zoneAge / 500 : zoneAge > TARGET_DISPLAY_MS - 1500 ? Math.max(0, (TARGET_DISPLAY_MS - zoneAge) / 1500) : 1;

      if (zoneAlpha > 0) {
        ctx.save();
        ctx.globalAlpha = zoneAlpha;

        // Zone glow
        const glow = ctx.createRadialGradient(landingZone.x + landingZone.w / 2, landingZone.y + landingZone.h / 2, 0,
          landingZone.x + landingZone.w / 2, landingZone.y + landingZone.h / 2, landingZone.w * 0.7);
        glow.addColorStop(0, theme.targetBorder + '40');
        glow.addColorStop(1, theme.targetBorder + '00');
        ctx.fillStyle = glow;
        ctx.fillRect(landingZone.x - landingZone.w * 0.3, landingZone.y - landingZone.h * 0.3, landingZone.w * 1.6, landingZone.h * 1.6);

        // Zone background
        ctx.fillStyle = theme.targetColor + '60';
        ctx.fillRect(landingZone.x, landingZone.y, landingZone.w, landingZone.h);

        // Zone border
        ctx.strokeStyle = theme.targetBorder;
        ctx.lineWidth = 2;
        ctx.setLineDash([8, 4]);
        ctx.strokeRect(landingZone.x, landingZone.y, landingZone.w, landingZone.h);
        ctx.setLineDash([]);

        // Theme-specific target rendering
        theme.renderTarget(ctx, landingZone.x, landingZone.y, landingZone.w, landingZone.h, time);

        // Timer bar
        const timerPct = Math.max(0, 1 - zoneAge / TARGET_DISPLAY_MS);
        ctx.fillStyle = theme.targetBorder + '80';
        ctx.fillRect(landingZone.x, landingZone.y + landingZone.h + 4, landingZone.w * timerPct, 3);

        ctx.restore();
      }

      if (zoneAge > TARGET_DISPLAY_MS) {
        landingZone = null;
      }
    }

    // Players update
    for (let i = players.length - 1; i >= 0; i--) {
      const p = players[i];

      if (p.landed) {
        p.fadeAlpha -= 0.03;
        if (p.fadeAlpha <= 0) {
          players.splice(i, 1);
          continue;
        }
      } else {
        // Physics
        p.vy += GRAVITY;
        p.swingPhase += 0.018;
        const wind = Math.sin(p.swingPhase) * WIND * p.swingAmp;
        p.vx += wind * 0.04;
        p.vx *= 0.998;
        p.vy *= 0.9995;

        // Speed cap
        const spd = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
        if (spd > MAX_SPEED) {
          p.vx = (p.vx / spd) * MAX_SPEED;
          p.vy = (p.vy / spd) * MAX_SPEED;
        }

        p.x += p.vx;
        p.y += p.vy;

        // Bounce off walls
        if (p.x < 25) {
          p.x = 25;
          p.vx = Math.abs(p.vx) * 0.65;
          p.bounceCount++;
        }
        if (p.x > W - 25) {
          p.x = W - 25;
          p.vx = -Math.abs(p.vx) * 0.65;
          p.bounceCount++;
        }

        // Check landing zone collision
        if (landingZone && p.y >= landingZone.y - 35 && p.y <= landingZone.y + landingZone.h + 15) {
          const inZone = p.x >= landingZone.x - 15 && p.x <= landingZone.x + landingZone.w + 15;
          if (inZone) {
            p.landed = true;
            p.landedAt = time;
            p.hitTarget = true;
            const flightTime = time - p.startTime;
            p.score = calculateScore(flightTime);
            totalScore += p.score;
            scoreDisplay.textContent = 'Очки: ' + totalScore;

            // Spawn themed particles
            theme.spawnParticles(p.x, p.y + 20, theme.splashColors, addParticle);

            // Floating score text
            addFloatingText(p.x, p.y - 50, '+' + p.score, '#10b981');
          }
        }

        // Fell below screen
        if (p.y > H + 60 && !p.landed) {
          p.landed = true;
          p.landedAt = time;
          p.hitTarget = false;
          p.score = 0;
          addFloatingText(p.x, H - 40, '✗', '#ef4444');

          // Small dust effect
          for (let j = 0; j < 6; j++) {
            addParticle({
              x: p.x, y: H - 10,
              vx: (Math.random() - 0.5) * 2,
              vy: -Math.random() * 1.5,
              r: 2 + Math.random() * 3,
              color: '#888',
              life: 1, decay: 0.03, type: 'circle',
            });
          }
        }
      }

      // Draw player
      ctx.save();
      ctx.globalAlpha = p.fadeAlpha;

      const playerSize = 32;

      // Parachute
      drawParachute(ctx, p.x, p.y, p.vx, p.vy, p.swingPhase, p.color, time, p.fadeAlpha);

      // Avatar or fallback circle
      if (p.avatarLoaded) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(p.x, p.y - 6, playerSize / 2, 0, Math.PI * 2);
        ctx.clip();
        ctx.drawImage(p.avatarImg, p.x - playerSize / 2, p.y - 6 - playerSize / 2, playerSize, playerSize);
        ctx.restore();
        // Border
        ctx.beginPath();
        ctx.arc(p.x, p.y - 6, playerSize / 2, 0, Math.PI * 2);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.arc(p.x, p.y - 6, playerSize / 2, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.8)';
        ctx.lineWidth = 2;
        ctx.stroke();
        // Initial letter
        ctx.font = 'bold 14px Inter, sans-serif';
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(p.username.charAt(0).toUpperCase(), p.x, p.y - 6);
      }

      // Score above player when landed
      if (p.landed && p.score) {
        ctx.font = 'bold 16px Inter, sans-serif';
        ctx.fillStyle = p.hitTarget ? '#10b981' : '#ef4444';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const bounce = Math.sin((time - (p.landedAt || time)) / 200) * 3;
        ctx.fillText('+' + p.score, p.x, p.y - 30 + bounce);

        // Username
        ctx.font = '11px Inter, sans-serif';
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        ctx.fillText(p.username, p.x, p.y - 46 + bounce);
      }

      ctx.restore();
    }

    // Particles update
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.08;
      p.vx *= 0.99;
      p.life -= p.decay;
      if (p.life <= 0) {
        particles.splice(i, 1);
        continue;
      }

      ctx.save();
      ctx.globalAlpha = p.life;
      if (p.type === 'leaf') {
        ctx.translate(p.x, p.y);
        ctx.rotate(p.life * 3);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.ellipse(0, 0, p.r * p.life, p.r * 0.5 * p.life, 0, 0, Math.PI * 2);
        ctx.fill();
      } else if (p.type === 'square') {
        ctx.fillStyle = p.color;
        const sz = p.r * 2 * p.life;
        ctx.fillRect(p.x - sz / 2, p.y - sz / 2, sz, sz);
      } else {
        ctx.beginPath();
        ctx.arc(p.x, p.y, Math.max(0.5, p.r * p.life), 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
      }
      ctx.restore();
    }

    // Floating texts
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
      const ft = floatingTexts[i];
      const age = time - ft.startTime;
      if (age > ft.duration) {
        floatingTexts.splice(i, 1);
        continue;
      }
      const progress = age / ft.duration;
      ctx.save();
      ctx.globalAlpha = 1 - progress;
      ctx.font = 'bold 20px Inter, sans-serif';
      ctx.fillStyle = ft.color;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(ft.text, ft.x, ft.y - progress * 50);
      ctx.restore();
    }

    requestAnimationFrame(gameLoop);
  }

  // Start
  scoreDisplay.textContent = 'Очки: 0';
  document.getElementById('controlsHint').textContent = 'Команда чата: ' + CMD;
  requestAnimationFrame(gameLoop);

  // Auto-spawn for demo
  setTimeout(() => {
    spawnPlayer('DemoDiver', '#a855f7');
  }, 1000);
  setTimeout(() => {
    spawnPlayer('SkyWalker', '#3b82f6');
  }, 3500);

})();
</script>
</body>
</html>
