<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plinko Bounce - TwitchGames</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; overflow: hidden; background: #0f0f1a; }
  .game-container { width: 100vw; height: 100vh; position: relative; overflow: hidden; }
  .game-canvas { position: absolute; inset: 0; }
  .game-ui { position: absolute; top: 0; left: 0; right: 0; padding: 20px; display: flex; justify-content: space-between; align-items: center; z-index: 50; }
  .score-display { background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); padding: 12px 24px; border-radius: 30px; font-weight: 700; font-size: 18px; color: white; border: 1px solid rgba(255,255,255,0.1); }
  .controls-hint { background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); padding: 12px 24px; border-radius: 30px; font-size: 14px; color: rgba(255,255,255,0.8); }
  .ball { position: absolute; width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #fff, #ec4899); box-shadow: 0 0 15px #ec4899; will-change: transform; }
  .peg { position: absolute; width: 12px; height: 12px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #a855f7, #6d28d9); box-shadow: 0 0 8px rgba(124,58,237,0.5); }
  .prize-lane { position: absolute; bottom: 0; width: 60px; padding: 12px 4px; text-align: center; font-weight: 700; font-size: 14px; color: white; border-radius: 8px 8px 0 0; transition: all 0.3s; }
  .prize-lane.hit { animation: laneHit 0.5s ease; }
  @keyframes laneHit { 0% { transform: scale(1); } 50% { transform: scale(1.1); filter: brightness(1.3); } 100% { transform: scale(1); } }
  .popup { position: absolute; color: #fbbf24; font-weight: 700; font-size: 24px; pointer-events: none; animation: popup 0.6s ease-out forwards; text-shadow: 0 0 10px rgba(251,191,36,0.8); }
  @keyframes popup { 0% { transform: translate(-50%, -50%) scale(0); opacity: 1; } 100% { transform: translate(-50%, -150%) scale(1); opacity: 0; } }
</style>
</head>
<body>
  <div class="game-container">
    <div class="game-canvas" id="gameCanvas"></div>
    <div class="game-ui">
      <div class="score-display" id="scoreDisplay">Очки: 0</div>
      <div class="controls-hint">Команда чата: !plinko</div>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const speed = parseFloat(params.get('speed')) || 5;
    const prizes = parseInt(params.get('prizes')) || 5;
    const tilt = parseFloat(params.get('tilt')) || 20;
    const command = params.get('command') || '!plinko';

    const canvas = document.getElementById('gameCanvas');
    const scoreDisplay = document.getElementById('scoreDisplay');
    let score = 0;
    const prizeValues = [100, 75, 50, 25, 10, 5, 2, 1];
    const pegs = [];
    const lanes = [];

    function initPegs() {
      const rows = 9;
      const spacing = 55;
      const startX = 120;
      for (let row = 0; row < rows; row++) {
        const cols = row + 2;
        for (let col = 0; col < cols; col++) {
          const peg = document.createElement('div');
          peg.className = 'peg';
          peg.style.left = (startX + col * spacing - row * spacing / 2) + 'px';
          peg.style.top = (row * spacing + 40) + 'px';
          canvas.appendChild(pegs);
          pegs.push(peg);
        }
      }
    }

    function initLanes() {
      const laneWidth = 60;
      const startX = 100;
      const colors = ['#ef4444', '#f97316', '#fbbf24', '#10b981', '#3b82f6', '#8b5cf6', '#ec4899'];
      for (let i = 0; i < prizes; i++) {
        const lane = document.createElement('div');
        lane.className = 'prize-lane';
        lane.style.left = (startX + i * laneWidth) + 'px';
        lane.style.width = laneWidth + 'px';
        lane.style.background = colors[i % colors.length];
        lane.textContent = prizeValues[i] || 1;
        lane.style.boxShadow = '0 -4px 12px ' + colors[i % colors.length] + '80';
        canvas.appendChild(lane);
        lanes.push(lane);
      }
    }

    function dropBall() {
      const ball = document.createElement('div');
      ball.className = 'ball';
      ball.style.left = '140px';
      ball.style.top = '10px';
      canvas.appendChild(ball);

      let x = 140, y = 10;
      const dropSpeed = (speed / 5) * 2;

      function animate() {
        y += dropSpeed;
        x += (Math.random() - 0.5) * 12 + tilt / 25;
        ball.style.left = x + 'px';
        ball.style.top = y + 'px';

        if (y > window.innerHeight - 40) {
          const laneIndex = Math.max(0, Math.min(prizes - 1, Math.floor((x - 100) / 60)));
          const prize = prizeValues[laneIndex] || 1;
          score += prize;
          scoreDisplay.textContent = 'Очки: ' + score;
          
          const popup = document.createElement('div');
          popup.className = 'popup';
          popup.textContent = '+' + prize;
          popup.style.left = x + 'px';
          popup.style.top = y + 'px';
          canvas.appendChild(popup);
          setTimeout(() => popup.remove(), 600);

          if (lanes[laneIndex]) {
            lanes[laneIndex].classList.add('hit');
            setTimeout(() => lanes[laneIndex].classList.remove('hit'), 500);
          }

          ball.remove();
          return;
        }
        requestAnimationFrame(animate);
      }
      animate();
    }

    initPegs();
    initLanes();
    setInterval(dropBall, 800);
  </script>
</body>
</html>
